name: Monthly Redeem Code Auto-Updater

on:
  schedule:
    # ⏰ Runs at 00:00 UTC on the 4th day of every month
    - cron: '0 0 4 * *'

  # 🖱️ Allows you to manually trigger this scraper anytime with a single click
  workflow_dispatch:

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Download Code from Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Python Libraries
        run: |
          pip install requests beautifulsoup4

      - name: 4. Run Scraper and Update GoGachaGame
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python updater.py
